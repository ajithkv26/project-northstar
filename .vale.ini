StylesPath = .vale/styles
MinAlertLevel = warning
IgnoredScopes = script, style, pre, code
SkippedScopes = script, style, pre, code

# Docs fail the pull request.
[docs/**.md]
BasedOnStyles = Northstar

# Homepage and story copy warn only.
[site/**.{html,md}]
BasedOnStyles = Northstar
Northstar.SentenceLength = warning
Northstar.Passive = warning
Northstar.OneIdea = warning
Northstar.Banned = warning

# UI labels and nav, written by scripts/check-prose.mjs. Not story copy.
[.vale/ui-labels.md]
BasedOnStyles = Northstar
