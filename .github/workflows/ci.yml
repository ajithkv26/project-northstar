name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and check
        uses: ./.github/actions/check

      - name: Upload built site
        id: site
        uses: actions/upload-artifact@v7
        with:
          name: site-preview
          path: dist
          if-no-files-found: error
          retention-days: 14

      - name: Upload single-file preview
        id: page
        uses: actions/upload-artifact@v7
        with:
          path: preview/northstar-preview.html
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Explain the preview
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Preview

          Download [northstar-preview.html](${{ steps.page.outputs.artifact-url }}) and open it in a browser. The CSS is included in that file.

          [site-preview](${{ steps.site.outputs.artifact-url }}) is the \`dist/\` directory GitHub Pages publishes from \`main\`.

          On a machine with the repo: \`npm run preview\`.

          This pull request does not get a hosted URL. Pages publishes \`main\` at https://ajithkv26.github.io/project-northstar/ after Pages is set to GitHub Actions.
          EOF

  prose:
    name: Prose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Vale
        run: |
          version=3.24.0
          mkdir -p "$HOME/.local/bin"
          work=$(mktemp -d)
          cd "$work"
          curl -fsSL -O -L "https://github.com/vale-cli/vale/releases/download/v${version}/vale_${version}_Linux_64-bit.tar.gz"
          curl -fsSL -O -L "https://github.com/vale-cli/vale/releases/download/v${version}/vale_${version}_checksums.txt"
          sha256sum -c "vale_${version}_checksums.txt" --ignore-missing
          tar -xzf "vale_${version}_Linux_64-bit.tar.gz" -C "$HOME/.local/bin" vale
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/vale" --version

      - name: Lint prose
        run: node scripts/check-prose.mjs
